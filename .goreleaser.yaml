# GoReleaser builds and publishes a GitHub Release for every pushed vX.Y.Z tag.
# Local dry run: goreleaser release --snapshot --clean
version: 2

project_name: bah

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: bah
    main: .
    binary: bah
    env:
      - CGO_ENABLED=0
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/MrT-coder/bitagentshub/internal/version.version={{ .Tag }}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^chore(\(.+\))?:'

release:
  github:
    owner: MrT-coder
    name: bitagentshub
  extra_files:
    - glob: ./install.ps1
    - glob: ./install.sh
